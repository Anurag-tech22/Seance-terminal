name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Eval
        if: "${{ secrets.OLLAMA_URL != '' }}"
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
        run: npm run eval

