# Render Blueprint: Free Web Service (No credit card required).
# To provide Ollama for free, set OLLAMA_URL to a free tunnel (e.g. ngrok / cloudflared pointing to your local Ollama)
# or a free Hugging Face Space.
services:
  - type: web
    name: seance-terminal
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEN_MODEL
        value: gemma3:1b
      - key: EMBED_MODEL
        value: embeddinggemma
      - key: OLLAMA_URL
        sync: false
